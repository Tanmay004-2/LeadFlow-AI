spring:
       datasource:





           url: jdbc:postgresql://${DB_HOST:localhost}:5432/leadflow
           username: ${DB_USER:leadflow_user}
           password: ${DB_PASS:password}
         jpa:
           hibernate:
              ddl-auto: validate
           properties:
              hibernate:
                tenant_identifier_resolver: com.leadflow.core.tenant.TenantIdentifierResolver
           show-sql: false
         flyway:
           enabled: true
           baseline-on-migrate: true

     app:
       jwt:
          secret: ${JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm}
       ai-service:
          url: ${AI_SERVICE_URL:http://localhost:8000}
